[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extsearch"
dynamic = ["version"]
description = "Product search across marketplaces of many countries: library, MCP server and HTTP API"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "viitlk" }]
keywords = ["marketplaces", "scraping", "search", "mcp", "prices", "olx", "amazon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
api = ["fastapi>=0.110", "uvicorn>=0.30"]
browser = ["playwright>=1.40"]
all = ["mcp>=2.0", "fastapi>=0.110", "uvicorn>=0.30", "playwright>=1.40"]
dev = ["pytest>=8"]

[project.scripts]
extsearch = "extsearch.cli:main"
extsearch-mcp = "extsearch.mcp_server:main"
extsearch-api = "extsearch.api:main"

[project.urls]
Homepage = "https://github.com/viitlk/extSearch"
Issues = "https://github.com/viitlk/extSearch/issues"

[tool.setuptools.dynamic]
# Single source of truth: extsearch/config.py
version = {attr = "extsearch.config.__version__"}

[tool.setuptools.packages.find]
include = ["extsearch*"]

[tool.setuptools.package-data]
extsearch = ["junk_words.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness and imports first; formatting is left to the eye.
select = ["E", "F", "W", "B", "UP", "I", "RUF"]
ignore = [
    "E501",    # long lines are fine for URLs and selector lists
    "BLE001",  # one bad marketplace must not kill a search
    "S110",    # a failed optional step is reported, not raised
    "RUF001",  # Cyrillic in regexes and anchors is intentional
    "RUF002",
    "RUF003",
]
